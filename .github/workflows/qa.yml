name: CI backend

on:
  pull_request:
    branches: [dev, qa]
  push:
    branches: [dev, qa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, coverage and container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test jacocoMergedReport
      - name: Enforce merged JaCoCo coverage thresholds
        run: |
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          report = ET.parse('build/reports/jacocoMergedReport/jacocoMergedReport.xml').getroot()
          counters = {item.attrib['type']: item.attrib for item in report.findall('counter')}
          for kind, minimum in {'LINE': 80, 'BRANCH': 60}.items():
              missed = int(counters[kind]['missed'])
              covered = int(counters[kind]['covered'])
              percentage = 100 * covered / (missed + covered)
              print(f'{kind}: {percentage:.2f}% (minimum {minimum}%)')
              if percentage < minimum:
                  raise SystemExit(f'{kind} coverage threshold not met')
          PYTHON
      - name: Validate the production container image
        run: docker build --file deployment/Dockerfile --tag compira-api:ci .
