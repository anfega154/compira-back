databaseChangeLog:
  - changeSet:
      id: team-members-allow-multiple-teams
      author: compira
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: "1"
            sql: >-
              SELECT count(*)
              FROM pg_constraint c
              JOIN pg_class t ON t.oid = c.conrelid
              WHERE t.relname = 'team_members'
                AND c.contype = 'p'
                AND array_length(c.conkey, 1) = 1
      changes:
        - sql:
            sql: |
              ALTER TABLE team_members DROP CONSTRAINT team_members_pkey;
              ALTER TABLE team_members ADD CONSTRAINT team_members_pkey PRIMARY KEY (user_id, team_id);
