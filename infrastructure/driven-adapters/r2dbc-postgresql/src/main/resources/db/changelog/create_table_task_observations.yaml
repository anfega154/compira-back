databaseChangeLog:
  - changeSet:
      id: create-table-task-observations
      author: compira
      changes:
        - createTable:
            tableName: task_observations
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: uuid_generate_v4()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: task_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: author_user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: VARCHAR(2000)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: task_observations
            baseColumnNames: task_id
            constraintName: fk_task_observations_task
            referencedTableName: tasks
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: task_observations
            baseColumnNames: author_user_id
            constraintName: fk_task_observations_author
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT
        - createIndex:
            tableName: task_observations
            indexName: idx_task_observations_task
            columns:
              - column:
                  name: task_id
