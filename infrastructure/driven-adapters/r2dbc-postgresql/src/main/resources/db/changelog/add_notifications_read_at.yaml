databaseChangeLog:
  - changeSet:
      id: add-task-notifications-read-at
      author: compira
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: task_notifications
                columnName: read_at
      changes:
        - addColumn:
            tableName: task_notifications
            columns:
              - column:
                  name: read_at
                  type: TIMESTAMPTZ
  - changeSet:
      id: add-task-notifications-unread-index
      author: compira
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_notifications_unread
      changes:
        - createIndex:
            tableName: task_notifications
            indexName: idx_notifications_unread
            columns:
              - column:
                  name: recipient_id
              - column:
                  name: id
