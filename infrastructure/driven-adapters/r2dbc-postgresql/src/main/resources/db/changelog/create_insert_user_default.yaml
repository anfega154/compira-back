databaseChangeLog:
  - changeSet:
      id: insert-default-admin-anfega
      author: compira
      dbms: postgresql
      changes:
        - sql:
            splitStatements: true
            sql: |
              INSERT INTO users (
                  id,
                  cognito_sub,
                  email,
                  first_name,
                  last_name,
                  phone_number,
                  preferred_mfa_channel,
                  status
              )
              VALUES (
                  '3488d4c8-a071-7031-e0af-6c5b2f93f4cd',
                  '3488d4c8-a071-7031-e0af-6c5b2f93f4cd',
                  'anfega@outlook.es',
                  'Andres Felipe',
                  'Gañan Moreno',
                  '+573052333736',
                  'EMAIL',
                  'ACTIVE'
              )
              ON CONFLICT (cognito_sub) DO NOTHING;

              INSERT INTO user_roles (user_id, role_id)
              SELECT u.id, r.id
              FROM users u
              JOIN roles r ON r.code = 'ADMINISTRATOR'
              WHERE u.id = '3488d4c8-a071-7031-e0af-6c5b2f93f4cd'
                AND u.cognito_sub = '3488d4c8-a071-7031-e0af-6c5b2f93f4cd'
                AND NOT EXISTS (
                    SELECT 1
                    FROM user_roles ur
                    WHERE ur.user_id = u.id
                      AND ur.role_id = r.id
                );