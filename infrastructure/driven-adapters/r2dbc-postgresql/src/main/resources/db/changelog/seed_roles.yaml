databaseChangeLog:
  - changeSet:
      id: seed-roles
      author: compira
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              DELETE FROM user_roles
              WHERE role_id IN (
                  SELECT id
                  FROM roles
                  WHERE code IN ('USER', 'ADMIN')
              );

              DELETE FROM roles
              WHERE code IN ('USER', 'ADMIN');

              INSERT INTO roles (code, name, description)
              VALUES
                  ('ADMINISTRATOR', 'Administrador', 'Usuario con control administrativo de la plataforma'),
                  ('COORDINATOR', 'Coordinador', 'Usuario responsable de coordinar equipos y procesos'),
                  ('COLLABORATOR', 'Colaborador', 'Usuario operativo estándar de la aplicación')
              ON CONFLICT (code) DO UPDATE
              SET name = EXCLUDED.name,
                  description = EXCLUDED.description;
