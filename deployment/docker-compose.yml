services:
  postgres:
    image: postgres:17-alpine
    container_name: compira-postgres
    environment:
      POSTGRES_DB: compira
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d compira"]
      interval: 10s
      timeout: 5s
      retries: 5
